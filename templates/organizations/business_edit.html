{% extends "organizations/base.html" %}

{% block title %}Editar empresa | Mi cartera{% endblock %}

{% block portfolio_content %}
  <h1 id="page-title" tabindex="-1">Editar empresa</h1>
  <p>{{ business.reseller.name }}</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Guardar cambios</button>
  </form>
  <p><a href="{% url 'organizations:business-detail' business.pk %}">Cancelar</a></p>
{% endblock %}
